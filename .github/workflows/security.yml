name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security Policy Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "FAIL: .env is tracked by Git!"
            exit 1
          fi
          echo "PASS: .env is not tracked."

      - name: Build Docker image
        run: docker build -t helpdesk:security .

      - name: Verify non-root container
        run: |
          USER_ID=$(docker run --rm --entrypoint id helpdesk:security -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" -ne 0
          echo "PASS: Container runs as non-root."
